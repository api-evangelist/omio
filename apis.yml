name: omio
description: Omio (formerly GoEuro) is a Berlin-based travel booking platform that lets travelers
  search, compare, and book trains, buses, ferries, and flights across thousands of transport
  providers throughout Europe and beyond from a single website and mobile app. Founded in 2013 as
  GoEuro and rebranded to Omio in 2019, the company aggregates schedules, fares, and seat
  availability from hundreds of carriers into one checkout. Omio does not publish a public developer
  API or developer portal; its carrier and distribution integrations are handled through private
  B2B partnerships. This profile was added to the API Evangelist network from VC-portfolio discovery
  and enriched by probing Omio's public domain, DNS, and security surface.
